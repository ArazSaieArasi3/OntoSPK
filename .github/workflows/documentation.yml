name: Documentation integrity
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'wiki-src/**'
      - 'tools/publication/**'
      - 'tools/boundaries/**'
      - 'evaluation/**'
      - 'README.md'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'wiki-src/**'
      - 'tools/publication/**'
      - 'tools/boundaries/**'
      - 'evaluation/**'
      - 'README.md'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/ontospk/requirements.txt
      - name: Verify generated coverage and Wiki source audits
        run: |
          python tools/publication/build_metadata_review.py
          python tools/publication/build_local_identity_review.py
          python tools/publication/test_local_identity_review.py
          python tools/publication/review_market_preservation.py
          python tools/publication/build_business_boundary_review.py
          python tools/publication/test_business_boundary_contract.py
          python tools/publication/build_coverage_register.py
          python tools/publication/audit_shacl_shapes.py
          python tools/publication/test_shacl_simple_constraints.py
          python tools/publication/build_webvowl_data.py
          python tools/publication/build_portal.py
          python tools/publication/audit_wiki.py
          python tools/publication/audit_pages.py
          git diff --exit-code -- evaluation/coverage-register.json.gz evaluation/coverage-register.md evaluation/shacl-shapes-audit.json evaluation/shacl-shapes-audit.md evaluation/shacl-simple-constraints.json.gz evaluation/shacl-simple-constraints.md evaluation/wiki-source-audit.json evaluation/wiki-source-audit.md evaluation/pages-completeness.json wiki-src docs evaluation/business-boundary-review.json evaluation/business-boundary-review.md evaluation/business-boundary-tests.json evaluation/business-boundary-tests.md evaluation/market-boundary-preservation.json evaluation/market-boundary-preservation.md evaluation/local-identity-review.json evaluation/local-identity-review.md evaluation/local-identity-tests.json.gz evaluation/local-identity-tests.md evaluation/robot-metadata-review.json.gz evaluation/robot-metadata-review.md docs/downloads/OntoSPK-v2.0.5-annotated.ttl
      - run: python tools/publication/check_publication.py
      - name: Verify immutable publication routes
        run: |
          python tools/publication/test_versioned_site.py
          python tools/publication/build_versioned_site.py --previous-ref origin/main
          python tools/publication/audit_versioned_site.py
