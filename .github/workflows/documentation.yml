name: Documentation integrity
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'wiki-src/**'
      - 'tools/publication/**'
      - 'README.md'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'wiki-src/**'
      - 'tools/publication/**'
      - 'README.md'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/ontospk/requirements.txt
      - run: python tools/publication/check_publication.py
