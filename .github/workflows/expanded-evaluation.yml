name: Expanded finite evaluation
on:
  pull_request:
    paths:
      - 'tools/publication/**'
      - 'tools/boundaries/**'
      - 'evaluation/**'
      - 'docs/**'
      - '.github/workflows/expanded-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/publication/**'
      - 'tools/boundaries/**'
      - 'evaluation/**'
      - 'docs/**'
      - '.github/workflows/expanded-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expanded-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r tools/ontospk/requirements.txt
      - run: python -m pip install -r tools/publication/fol-requirements.txt
      - name: Obtain checksum-pinned ROBOT
        run: |
          curl --fail --location --retry 3 https://github.com/ontodev/robot/releases/download/v1.9.11/robot.jar --output "$RUNNER_TEMP/robot.jar"
          echo '53cd275c8e4c0dad1fc2c1c34174876795cd7d6b6926e1444adcbb0cb3c7ab26'"  $RUNNER_TEMP/robot.jar" | sha256sum --check --strict
      - name: Execute expanded controls and adjudicate actual results
        env:
          ROBOT_JAR: ${{ runner.temp }}/robot.jar
        run: |
          python tools/publication/test_fol_pilot.py
          python tools/publication/build_diagram_review.py
          python tools/publication/test_diagram_review.py
          python tools/publication/audit_documentation.py
          python tools/publication/test_documentation_audit.py
          git diff --exit-code -- evaluation/diagram-provenance.json evaluation/diagram-provenance.md evaluation/documentation-parity.json evaluation/documentation-parity.md docs/assets/diagrams
          python tools/publication/check_fol_pilot_sources.py
          python tools/publication/build_metadata_review.py
          python tools/publication/test_metadata_view.py --robot "$ROBOT_JAR"
          python tools/publication/build_local_identity_review.py
          python tools/publication/test_local_identity_review.py
          python tools/publication/review_market_preservation.py
          python tools/publication/build_business_boundary_review.py
          python tools/publication/test_business_boundary_contract.py
          python tools/publication/build_coverage_register.py
          python tools/publication/audit_shacl_shapes.py
          python tools/publication/test_shacl_simple_constraints.py
          python tools/publication/test_shacl_complex.py
          python tools/publication/test_owl_reasoning.py --robot "$ROBOT_JAR"
          python tools/publication/test_cq_regression.py
          python tools/publication/test_core_regression.py --robot "$ROBOT_JAR"
          python tools/publication/adjudicate_evaluation.py
          git diff --exit-code -- semantic
          git diff --exit-code -- evaluation/coverage-register.json.gz evaluation/coverage-register.md evaluation/shacl-simple-constraints.json.gz evaluation/shacl-simple-constraints.md evaluation/shacl-complex.json.gz evaluation/shacl-complex.md evaluation/cq-regression.json.gz evaluation/cq-regression.md evaluation/business-boundary-review.json evaluation/business-boundary-review.md evaluation/business-boundary-tests.json evaluation/business-boundary-tests.md evaluation/market-boundary-preservation.json evaluation/market-boundary-preservation.md evaluation/local-identity-review.json evaluation/local-identity-review.md evaluation/local-identity-tests.json.gz evaluation/local-identity-tests.md evaluation/robot-metadata-review.json.gz evaluation/robot-metadata-review.md evaluation/robot-metadata-tests.json.gz evaluation/robot-metadata-tests.md evaluation/fol-pilot.json.gz evaluation/fol-pilot.md tools/publication/fol-pilot-witnesses.json.gz docs/downloads/OntoSPK-v2.0.5-annotated.ttl
      - name: Verify public package and immutable documentation
        run: |
          python tools/publication/check_publication.py
          python tools/publication/test_versioned_site.py
          python tools/publication/build_versioned_site.py --previous-ref origin/main
          python tools/publication/audit_versioned_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-evaluation-${{ github.sha }}
          path: |
            build/fol-pilot/*.smt2
            build/fol-pilot/artifact-manifest.json
            build/fol-pilot/fresh-witnesses.json
            evaluation/fol-pilot.*
            evaluation/diagram-provenance.*
            evaluation/documentation-parity.*
            build/metadata-tests/raw-command-logs/
            evaluation/robot-metadata-*
            evaluation/local-identity-*
            evaluation/market-boundary-preservation.*
            evaluation/business-boundary-*
            evaluation/*complex*
            evaluation/*hermit*
            evaluation/robot-report*
            evaluation/cq-regression*
            evaluation/core-regression*
            evaluation/v2.0.2-closeout*
          retention-days: 30
  publish:
    needs: evaluate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain previous releases and publish the FOL pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/publication/publish_evaluation_release.py
          python tools/publication/publish_preservation_release.py
          python tools/publication/publish_identity_release.py
          python tools/publication/publish_metadata_release.py
          python tools/publication/publish_fol_release.py
          python tools/publication/publish_visual_release.py
